name: Build APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract Android project
    run: |
      ZIP_FILE=$(find . -maxdepth 3 -type f -name '*.zip' -print -quit)
      if [ -z "$ZIP_FILE" ]; then
        echo "No ZIP file found in repository"
        exit 1
      fi
      mkdir -p extracted
      unzip -oq "$ZIP_FILE" -d extracted

  - name: Find Android project
    run: |
      APP_BUILD=$(find extracted -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) -print -quit)
      if [ -z "$APP_BUILD" ]; then
        echo "App build file not found inside ZIP"
        find extracted -maxdepth 6 -type f -print
        exit 1
      fi
      PROJECT_DIR=$(dirname "$(dirname "$APP_BUILD")")
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Android project found at: $PROJECT_DIR"

  - name: Fix Java and Kotlin targets
    run: |
      FILE="$PROJECT_DIR/app/build.gradle.kts"
      if [ ! -f "$FILE" ]; then
        FILE="$PROJECT_DIR/app/build.gradle"
      fi
      python3 - "$FILE" <<'PY'
      import sys
      from pathlib import Path

      p = Path(sys.argv[1])
      s = p.read_text()

      if 'compileOptions {' not in s:
          block = '''
          compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          '''
          s = s.replace('    defaultConfig {', block + '\n    defaultConfig {', 1)

      if 'kotlinOptions {' not in s:
          block = '''
          kotlinOptions {
              jvmTarget = "17"
          }
          '''
          s = s.replace('    defaultConfig {', block + '\n    defaultConfig {', 1)
      else:
          import re
          s = re.sub(r'jvmTarget\s*=\s*["\'][^"\']+["\']', 'jvmTarget = "17"', s)

      p.write_text(s)
      print("Java and Kotlin targets configured.")
      PY

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: LudoFitness-APK
      path: '**/build/outputs/apk/debug/*.apk'
      if-no-files-found: error
