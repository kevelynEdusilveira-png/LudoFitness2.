
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      
      - name: Find Android project
        run: |
          if [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "LudoFitnessAndroid/app/build.gradle" ] || [ -f "LudoFitnessAndroid/app/build.gradle.kts" ]; then
            echo "PROJECT_DIR=LudoFitnessAndroid" >> "$GITHUB_ENV"
          else
            echo "Android app folder not found"
            find . -maxdepth 5 \( -name AndroidManifest.xml -o -name build.gradle -o -name build.gradle.kts \) -print
            exit 1
          fi


      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoFitness-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
