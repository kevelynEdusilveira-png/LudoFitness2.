
      - name: Fix Java and Kotlin targets
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"
          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace(
              '    defaultConfig {',
              '''    compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }
          kotlinOptions {
              jvmTarget = "17"
          }
          defaultConfig {''',
              1
          )
          p.write_text(s)
          PY

name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository"
            exit 1
          fi
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

      - name: Find Android project
        run: |
          APP_BUILD=$(find extracted -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) -print -quit)
          if [ -z "$APP_BUILD" ]; then
            echo "App build file not found inside ZIP"
            find extracted -maxdepth 6 -type f -print
            exit 1
          fi
          PROJECT_DIR=$(dirname "$(dirname "$APP_BUILD")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoFitness-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
