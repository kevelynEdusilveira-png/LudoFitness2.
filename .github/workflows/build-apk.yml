[23:21, 20/10/2026] Keh: name: Build LudoFitness APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir projeto
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          test -n "$ZIP" || { echo "ZIP nao encontrado"; exit 1; }
          unzip -q "$ZIP" -d projeto
          SETTINGS=$(find projeto -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS" || { echo "settings.gradle.kts nao encontrado"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Ajustar compatibilidade Java e Kotlin
        run: |
          python3 - <<'PY'
          import os, re
          p = os.environ["PROJECT_DIR"] + "/app/build.gradle.kts"
          if not os.path.isfile(p):
              raise SystemExit("Arquivo app/build.gradle.kts nao encontrado")
          s = open(p).read()
          block = '''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          '''
          if re.search(r'(?m)^android\s*\{', s):
              s = re.sub(r'(?m)^android\s*\{', 'android {' + block, s, count=1)
          else:
              raise SystemExit("Bloco android nao encontrado")
          open(p, 'w').write(s)
          print("Configuracao de compatibilidade adicionada")
          PY

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LudoFitness-APK
          path: projeto/*/app/build/outputs/apk/debug/.apk
          if-no-files-found: error
