
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        run: |
          if [ -f "gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "LudoFitnessAndroid/gradlew" ]; then
            echo "PROJECT_DIR=LudoFitnessAndroid" >> "$GITHUB_ENV"
          else
            echo "Gradle wrapper not found"
            find . -maxdepth 4 -name gradlew -print
            exit 1
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoFitness-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
